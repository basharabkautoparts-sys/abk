name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # The catalogue is baked into the HTML at build time. A nightly rebuild gives
  # parts added in the admin real prerendered pages (and gets them into the
  # sitemap) without anyone having to push. Visitors see new parts immediately
  # either way — the pages refresh themselves from Supabase once loaded.
  #
  # This also touches Supabase every day, which on its own is enough to stop a
  # free project pausing. keep-supabase-awake.yml is the backstop for when a
  # build is broken.
  schedule:
    - cron: '17 2 * * *'

  # "Run workflow" in the Actions tab — use this after a big catalogue change
  # instead of waiting for the nightly run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a scheduled
# rebuild can't discard a push that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if Supabase is not configured
        # Without these the build silently succeeds in demo mode and would
        # publish the bundled sample catalogue as if it were the real one.
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY are not set."
            echo "::error::Add them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      # Reports where the site will actually be served from. On a project site
      # that is <owner>.github.io + /<repo>; once a custom domain is set in the
      # Pages settings it becomes that domain + no subpath. Feeding the build
      # from here means switching domains needs no code change.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: |
          echo "Building for ${PUBLIC_SITE_URL}${BASE_PATH}/"
          pnpm build

      - name: Verify the build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: |
          pages=$(find build/parts -mindepth 2 -name index.html | wc -l)
          echo "Prerendered $pages part pages."
          # A build can succeed while reaching Supabase with an empty result —
          # publishing an empty shop is worse than failing here.
          [ "$pages" -gt 0 ] || { echo "::error::No part pages were prerendered."; exit 1; }
          # Every internal link carries the base path; if that went wrong the
          # whole site 404s, so check before publishing rather than after.
          grep -q "href=\"${BASE_PATH}/parts/\"" build/index.html \
            || { echo "::error::Home page links are missing the base path '${BASE_PATH}'."; exit 1; }
          grep -q "canonical\" href=\"${PUBLIC_SITE_URL}${BASE_PATH}/\"" build/index.html \
            || { echo "::error::Canonical URL does not match ${PUBLIC_SITE_URL}${BASE_PATH}/."; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
