name: Keep Supabase awake

# Supabase pauses a free project that goes a week without "sufficient user
# database activity", and a paused project takes the catalogue down with it.
# The docs put the bar at "a few user requests to the database each day", so
# this makes several distinct queries rather than one — a single request a day
# sits right on the boundary of that wording.
#
# The nightly deploy also queries Supabase heavily (it reads the whole
# catalogue to prerender ~20 pages). This workflow is the backstop: it keeps
# running even when a build is broken, and costs a handful of HTTP requests.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY are not set."
            exit 1
          fi

          # Plain anonymous reads — the same requests a visitor's browser makes.
          # No elevated key, and RLS means none of them can modify anything.
          queries=(
            'parts?select=count'
            'parts?select=id,slug&order=created_at.desc&limit=5'
            'parts?select=id&published=eq.true&limit=1'
            'parts?select=category_slug&limit=20'
          )

          failed=0
          for q in "${queries[@]}"; do
            status=$(curl -sS -o /tmp/body -w '%{http_code}' \
              "${PUBLIC_SUPABASE_URL}/rest/v1/${q}" \
              -H "apikey: ${PUBLIC_SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${PUBLIC_SUPABASE_ANON_KEY}")
            body=$(head -c 120 /tmp/body)
            echo "HTTP ${status}  ${q}  →  ${body}"
            [ "$status" = "200" ] || failed=1
            sleep 2
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Supabase did not answer 200 — the project may be paused, or the key rotated."
            {
              echo "### ❌ Supabase ping failed"
              echo "The project may be paused. Check <https://supabase.com/dashboard>."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Written to the run summary so the Actions page shows the outcome
          # without anyone having to open the log.
          {
            echo "### ✅ Supabase is awake"
            echo ""
            echo "\`${#queries[@]}\` database queries answered 200 at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo ""
            echo "Next scheduled run: tomorrow 05:41 UTC."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reminder about scheduled-workflow expiry
        # GitHub disables cron workflows in a repository with no pushes for 60
        # days, which would silently stop this one. Surface it in the log so the
        # run itself is the reminder.
        run: |
          echo "::notice::GitHub disables scheduled workflows after 60 days without repository activity."
          echo "::notice::If nobody pushes for two months, re-enable this workflow in the Actions tab."
